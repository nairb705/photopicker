<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoPick — AI 사진 선별기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --bg2: #161618;
      --bg3: #1e1e21;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #f0efe8;
      --text2: #9a9892;
      --text3: #5a5955;
      --accent: #c8f060;
      --accent-dim: rgba(200,240,96,0.12);
      --accent-text: #0e1a00;
      --gold: #f5c842;
      --silver: #b0b8c8;
      --bronze: #c87840;
      --danger: #ff5c5c;
      --radius: 12px;
      --radius-sm: 7px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      padding: 2rem 2rem 0;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .tagline {
      font-size: 0.8rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
    }

    /* ── Layout ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* ── Drop Zone ── */
    .drop-zone {
      border: 1.5px dashed var(--border2);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--bg2);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(200,240,96,0.04);
    }
    .drop-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      background: var(--bg3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border2);
    }
    .drop-icon svg { width: 22px; height: 22px; stroke: var(--text2); fill: none; }
    .drop-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .drop-sub {
      font-size: 0.8rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
    }
    #file-input { display: none; }

    /* ── Thumbnail Grid ── */
    .thumb-section { margin-top: 1.5rem; }
    .thumb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .thumb-header-label {
      font-size: 0.78rem;
      font-family: 'DM Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .clear-btn {
      font-size: 0.75rem;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .clear-btn:hover { color: var(--danger); }
    .thumb-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-start;
    }
    /* Single thumbs (ungrouped) keep consistent size */
    .thumb-grid > .thumb-wrap {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--bg3);
    }
    .thumb-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: opacity 0.2s;
    }
    .thumb-wrap:hover img { opacity: 0.7; }
    .thumb-remove {
      position: absolute; top: 4px; right: 4px;
      background: rgba(0,0,0,0.7);
      border: none; border-radius: 50%;
      width: 20px; height: 20px;
      color: #fff; font-size: 14px;
      cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
    }
    .thumb-wrap:hover .thumb-remove { opacity: 1; }

    /* ── Controls ── */
    .controls {
      margin-top: 1.5rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .controls-label {
      font-size: 0.88rem;
      color: var(--text2);
      white-space: nowrap;
    }
    .controls-label strong { color: var(--text); font-weight: 500; }
    .n-input {
      width: 72px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      padding: 0.4rem 0.6rem;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    .n-input::-webkit-outer-spin-button,
    .n-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .n-input:focus { border-color: var(--accent); }
    .n-input.error { border-color: var(--danger); }
    .analyze-btn {
      margin-left: auto;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.55rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .analyze-btn:hover:not(:disabled) { opacity: 0.88; }
    .analyze-btn:active:not(:disabled) { transform: scale(0.97); }
    .analyze-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Progress ── */
    .progress-area {
      margin-top: 1rem;
      display: none;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Results ── */
    .results-section { margin-top: 2rem; display: none; }
    .results-heading {
      font-size: 0.78rem;
      font-family: 'DM Mono', monospace;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }
    .result-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 10px;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      transition: border-color 0.15s;
    }
    .result-card:hover { border-color: var(--border2); }
    .result-card.top1 { border-color: rgba(245,200,66,0.35); }
    .rank-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      padding-top: 2px;
    }
    .rank-badge {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      flex-shrink: 0;
    }
    .rank-1 { background: rgba(245,200,66,0.15); color: var(--gold); border: 1px solid rgba(245,200,66,0.3); }
    .rank-2 { background: rgba(176,184,200,0.12); color: var(--silver); border: 1px solid rgba(176,184,200,0.25); }
    .rank-3 { background: rgba(200,120,64,0.12); color: var(--bronze); border: 1px solid rgba(200,120,64,0.25); }
    .rank-other { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
    .score-num {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--text3);
    }
    .result-thumb {
      width: 80px; height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .result-body { flex: 1; min-width: 0; }
    .result-summary {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .strength-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .tag {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 20px;
      background: var(--accent-dim);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
    }
    .tag.weak {
      background: rgba(255,92,92,0.08);
      color: rgba(255,92,92,0.7);
    }
    .result-file {
      font-size: 0.7rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 4px;
    }

    /* ── Loader spinner ── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(14,26,0,0.3);
      border-top-color: var(--accent-text);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty / error states ── */
    .api-key-banner {
      background: rgba(255,92,92,0.08);
      border: 1px solid rgba(255,92,92,0.2);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      color: rgba(255,92,92,0.9);
      margin-top: 0.75rem;
      font-family: 'DM Mono', monospace;
      display: none;
    }


    /* ── Edit Panel ── */
    .edit-btn {
      margin-top: 10px;
      background: none;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text2);
      font-size: 0.78rem;
      font-family: 'DM Sans', sans-serif;
      padding: 5px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
    .edit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .edit-panel {
      margin-top: 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: none;
    }
    .edit-panel.open { display: block; }

    .edit-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 12px; }
    .slider-row { display: flex; flex-direction: column; gap: 4px; }
    .slider-label {
      display: flex; justify-content: space-between;
      font-size: 0.72rem; color: var(--text3);
      font-family: 'DM Mono', monospace;
    }
    .slider-label span { color: var(--text2); }
    input[type=range].edit-range {
      width: 100%; height: 3px; appearance: none;
      background: var(--border2); border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range].edit-range::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
    }

    .edit-prompt-row {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .edit-prompt-input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .edit-prompt-input:focus { border-color: var(--accent); }
    .edit-prompt-input::placeholder { color: var(--text3); }

    .ai-suggest-btn {
      background: none;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text3);
      font-size: 0.75rem;
      font-family: 'DM Mono', monospace;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .ai-suggest-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ai-suggest-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .edit-actions { display: flex; gap: 8px; align-items: center; }
    .apply-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .apply-btn:hover { opacity: 0.85; }
    .apply-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text3);
      font-size: 0.78rem;
      font-family: 'DM Sans', sans-serif;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .reset-btn:hover { border-color: var(--border2); color: var(--text2); }
    .download-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--accent);
      font-size: 0.78rem;
      font-family: 'DM Mono', monospace;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: none;
    }
    .download-btn:hover { border-color: var(--accent); }
    .download-btn.visible { display: inline-flex; align-items: center; gap: 5px; }

    /* ── Compare Slider ── */
    .compare-wrap {
      margin-top: 10px;
      display: none;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      user-select: none;
      cursor: col-resize;
      background: var(--bg);
    }
    .compare-wrap.visible { display: block; }
    .compare-wrap img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
    }
    .compare-after {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    .compare-after img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .compare-divider {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: var(--accent);
      cursor: col-resize;
      z-index: 10;
    }
    .compare-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--accent-text);
      display: flex; align-items: center; justify-content: center;
      cursor: col-resize;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .compare-handle svg { width: 14px; height: 14px; }
    .compare-label-before, .compare-label-after {
      position: absolute;
      bottom: 8px;
      font-size: 0.68rem;
      font-family: 'DM Mono', monospace;
      padding: 2px 7px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 5;
    }
    .compare-label-before {
      left: 8px;
      background: rgba(14,26,0,0.7);
      color: var(--accent);
    }
    .compare-label-after {
      right: 8px;
      background: rgba(0,0,0,0.55);
      color: var(--text2);
    }

    /* ── Step labels ── */
    .edit-step {
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .edit-step:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .edit-step-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text2);
    }
    .step-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(200,240,96,0.3);
      color: var(--accent);
      font-size: 0.7rem;
      font-family: 'DM Mono', monospace;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .step-hint {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
    }

    /* ── Compare hint overlay ── */
    .compare-hint-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.6);
      color: var(--text2);
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 20;
      white-space: nowrap;
    }
    .compare-hint-overlay.hidden { opacity: 0; }

    .apply-btn {
      display: flex; align-items: center; gap: 6px;
    }
    .ai-suggest-btn {
      display: flex; align-items: center; gap: 5px;
    }

    .suggest-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .suggest-chip {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(200,240,96,0.07);
      border: 1px solid rgba(200,240,96,0.2);
      color: var(--accent);
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      transition: background 0.15s;
    }
    .suggest-chip:hover { background: rgba(200,240,96,0.15); }
    .suggest-chip.selected {
      background: rgba(200,240,96,0.25);
      border-color: var(--accent);
      color: var(--accent);
    }
    .chips-loading {
      font-size: 0.72rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
    }
    .chips-section-label {
      font-size: 0.7rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
      width: 100%;
      margin-bottom: 5px;
    }
    .chips-input-row {
      width: 100%;
      margin-top: 8px;
    }
    .chips-input-row .edit-prompt-input {
      width: 100%;
      font-size: 0.8rem;
    }

    .edit-spinner {
      width: 12px; height: 12px;
      border: 2px solid rgba(200,240,96,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    /* ── Dedup button & group visuals ── */
    .dedup-btn {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      color: var(--text3);
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .dedup-btn:hover { color: var(--accent); border-color: rgba(200,240,96,0.4); }
    .dedup-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
    .dedup-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Group: stack card ── */
    .thumb-group { display: contents; }

    .thumb-group.grouped {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    /* All thumbs inside a group fill the slot */
    .thumb-group.grouped .thumb-wrap {
      position: absolute !important;
      top: 0; left: 0;
      width: 80px !important;
      height: 80px !important;
    }

    /* Representative (first child thumb-wrap) on top */
    .thumb-group.grouped .thumb-wrap:first-of-type {
      z-index: 3;
    }

    /* Stack layers: shift each one slightly */
    .thumb-group.grouped.multi .thumb-wrap:nth-of-type(2) {
      top: -3px; left: 3px; z-index: 2;
      opacity: 1; filter: brightness(0.6);
      pointer-events: none;
    }
    .thumb-group.grouped.multi .thumb-wrap:nth-of-type(3) {
      top: -6px; left: 6px; z-index: 1;
      opacity: 1; filter: brightness(0.35);
      pointer-events: none;
    }
    /* Any beyond 3rd: hidden */
    .thumb-group.grouped.multi .thumb-wrap:nth-of-type(n+4) {
      display: none;
    }

    /* Accent border on rep */
    .thumb-group.grouped.multi .thumb-wrap:first-of-type {
      border-color: rgba(200,240,96,0.6) !important;
      box-shadow: 0 0 0 1px rgba(200,240,96,0.2);
    }

    /* Badge */
    .group-badge {
      display: none;
    }
    .thumb-group.grouped.multi .group-badge {
      display: flex;
      align-items: center;
      position: absolute;
      bottom: -7px; right: -7px;
      font-size: 0.58rem;
      font-family: 'DM Mono', monospace;
      font-weight: 700;
      background: var(--accent);
      color: var(--accent-text);
      padding: 1px 6px;
      border-radius: 20px;
      z-index: 10;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .edit-sliders { grid-template-columns: 1fr; }
      .edit-panel { padding: 0.75rem; }
    }

    @media (max-width: 520px) {
      header { flex-direction: column; gap: 0.25rem; padding: 1.25rem 1.25rem 0; }
      main { padding: 1.5rem 1rem 3rem; }
      .controls { flex-direction: column; align-items: flex-start; }
      .analyze-btn { margin-left: 0; width: 100%; justify-content: center; }
      .result-thumb { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Photo<span>Pick</span></div>
  <div class="tagline">AI 사진 선별기</div>
</header>

<main>
  <!-- Drop Zone -->
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
    <div class="drop-title">사진을 드래그하거나 클릭해서 업로드</div>
    <div class="drop-sub">JPG · PNG · WEBP · RAW (CR2/NEF/ARW/RAF/DNG 등) — 여러 장 동시 선택 가능</div>
  </div>
  <input type="file" id="file-input" multiple accept="image/*,.cr2,.cr3,.crw,.nef,.nrw,.arw,.sr2,.srf,.raf,.orf,.rw2,.rwl,.dng,.pef,.ptx,.x3f,.mrw,.3fr,.fff,.iiq,.erf,.kdc,.dcr,.mef,.mos,.srw">

  <!-- Thumbnails -->
  <div class="thumb-section" id="thumb-section" style="display:none">
    <div class="thumb-header">
      <span class="thumb-header-label" id="thumb-count-label">0 photos</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="dedup-btn" id="dedup-btn" onclick="toggleDedup()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="14" height="14" rx="2"/><path d="M16 3h3a2 2 0 0 1 2 2v14"/></svg>
          유사 사진 묶기
        </button>
        <button class="clear-btn" onclick="clearAll()">전체 삭제</button>
      </div>
    </div>
    <div class="thumb-grid" id="thumb-grid"></div>
  </div>

  <!-- Controls -->
  <div class="controls" id="controls" style="display:none">
    <span class="controls-label">총 <strong id="total-count">0</strong>장 중에서</span>
    <input type="number" class="n-input" id="n-input" min="1" value="3">
    <span class="controls-label">장 선별</span>
    <button class="analyze-btn" id="analyze-btn" onclick="startAnalysis()">
      AI 분석 시작
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
  <div class="api-key-banner" id="api-error"></div>

  <!-- Progress -->
  <div class="progress-area" id="progress-area">
    <div class="progress-meta">
      <span id="progress-label">분석 중...</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <!-- Results -->
  <div class="results-section" id="results-section">
    <div class="results-heading" id="results-heading"></div>
    <div id="results-list"></div>
  </div>
</main>

<script>
  const images = [];

  // ── File input & drag-drop ──
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  const MAX_PX = 1920;
  const MAX_KB = 900;
  const RAW_EXTS = new Set([
    'cr2','cr3','crw','nef','nrw','arw','sr2','srf','raf','orf',
    'rw2','rwl','dng','pef','ptx','x3f','mrw','3fr','fff','iiq',
    'erf','kdc','dcr','mef','mos','srw'
  ]);

  function isRawFile(filename) {
    return RAW_EXTS.has(filename.split('.').pop().toLowerCase());
  }

  function resizeImage(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > MAX_PX || height > MAX_PX) {
            const ratio = Math.min(MAX_PX / width, MAX_PX / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          let quality = 0.85;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length * 0.75 > MAX_KB * 1024 && quality > 0.4) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve({ src: dataUrl, name: file.name, type: 'image/jpeg', isRaw: false });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function loadRawFile(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        // For RAW we store a placeholder thumbnail and the raw base64 separately
        resolve({
          src: e.target.result,
          name: file.name,
          type: file.type || 'application/octet-stream',
          isRaw: true,
        });
      };
      reader.readAsDataURL(file);
    });
  }

  function handleFiles(files) {
    Array.from(files).forEach(async file => {
      const ext = file.name.split('.').pop().toLowerCase();
      if (!file.type.startsWith('image/') && !RAW_EXTS.has(ext)) return;
      const processed = isRawFile(file.name)
        ? await loadRawFile(file)
        : await resizeImage(file);
      images.push(processed);
      renderThumbs();
    });
  }

  let dedupActive = false;
  let dedupGroups = null; // cached groups from last dedup run

  function makeThumbEl(img, i) {
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const thumbContent = img.isRaw
      ? `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg3);font-family:'DM Mono',monospace;">
          <div style="font-size:11px;color:var(--accent);font-weight:500;">${img.name.split('.').pop().toUpperCase()}</div>
          <div style="font-size:9px;color:var(--text3);margin-top:2px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${img.name}</div>
         </div>`
      : `<img src="${img.src}" alt="${img.name}">`;
    wrap.innerHTML = thumbContent + `<button class="thumb-remove" onclick="removeImage(event,${i})">×</button>`;
    return wrap;
  }

  function renderThumbs() {
    const grid = document.getElementById('thumb-grid');
    grid.innerHTML = '';

    if (dedupActive && dedupGroups) {
      // Render grouped view
      dedupGroups.forEach(group => {
        const isMulti = group.length > 1;
        const groupEl = document.createElement('div');
        groupEl.className = 'thumb-group grouped' + (isMulti ? ' multi' : '');

        if (isMulti) {
          const badge = document.createElement('div');
          badge.className = 'group-badge';
          badge.textContent = `${group.length}장`;
          groupEl.appendChild(badge);
        }

        // Only render representative (first) visually; rest are hidden via CSS
        group.forEach(idx => {
          groupEl.appendChild(makeThumbEl(images[idx], idx));
        });
        grid.appendChild(groupEl);
      });
    } else {
      // Normal flat view
      images.forEach((img, i) => {
        const wrap = makeThumbEl(img, i);
        grid.appendChild(wrap);
      });
    }

    const n = images.length;
    const effectiveN = dedupActive && dedupGroups ? dedupGroups.length : n;
    document.getElementById('thumb-count-label').textContent =
      dedupActive && dedupGroups
        ? `${n}장 → ${dedupGroups.length}그룹`
        : `${n} photo${n !== 1 ? 's' : ''}`;
    document.getElementById('total-count').textContent = effectiveN;
    const nInput = document.getElementById('n-input');
    nInput.max = Math.max(1, effectiveN - 1);
    if (parseInt(nInput.value) >= effectiveN) nInput.value = Math.max(1, effectiveN - 1);
    document.getElementById('thumb-section').style.display = n ? 'block' : 'none';
    document.getElementById('controls').style.display = n > 1 ? 'flex' : 'none';
  }

  async function toggleDedup() {
    const btn = document.getElementById('dedup-btn');
    if (dedupActive) {
      // Turn off
      dedupActive = false;
      dedupGroups = null;
      btn.classList.remove('active');
      renderThumbs();
      return;
    }
    // Turn on: compute groups
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:10px;height:10px;border-width:1.5px;"></span> 분석 중...`;
    dedupGroups = await groupSimilarImages(0.92);
    dedupActive = true;
    btn.disabled = false;
    btn.classList.add('active');
    btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="14" height="14" rx="2"/><path d="M16 3h3a2 2 0 0 1 2 2v14"/></svg> 묶기 해제`;
    renderThumbs();
  }

  function removeImage(e, i) {
    e.stopPropagation();
    images.splice(i, 1);
    renderThumbs();
    document.getElementById('results-section').style.display = 'none';
  }

  function clearAll() {
    images.length = 0;
    dedupActive = false;
    dedupGroups = null;
    const btn = document.getElementById('dedup-btn');
    if (btn) { btn.classList.remove('active'); btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="14" height="14" rx="2"/><path d="M16 3h3a2 2 0 0 1 2 2v14"/></svg> 유사 사진 묶기`; }
    renderThumbs();
    document.getElementById('results-section').style.display = 'none';
  }

  // ── Similarity (perceptual hash via 16x16 grayscale) ──
  function getImageHash(src, isRaw) {
    // RAW files can't be rendered by the browser — return a unique random hash
    // so they're never grouped together (each RAW is treated as its own group)
    if (isRaw) {
      return Promise.resolve(Array.from({length: 256}, () => Math.random() * 255));
    }
    return new Promise(resolve => {
      const img = new Image();
      const fallback = () => resolve(Array.from({length: 256}, () => Math.random() * 255));
      img.onerror = fallback;
      // Timeout safety: if onload never fires (e.g. corrupt file), resolve after 3s
      const timer = setTimeout(fallback, 3000);
      img.onload = () => {
        clearTimeout(timer);
        try {
          const SIZE = 16;
          const canvas = document.createElement('canvas');
          canvas.width = SIZE; canvas.height = SIZE;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, SIZE, SIZE);
          const data = ctx.getImageData(0, 0, SIZE, SIZE).data;
          const gray = [];
          for (let i = 0; i < SIZE * SIZE; i++) {
            gray.push(0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2]);
          }
          resolve(gray);
        } catch(e) { fallback(); }
      };
      img.src = src;
    });
  }

  function similarity(hashA, hashB) {
    let diff = 0;
    for (let i = 0; i < hashA.length; i++) diff += Math.abs(hashA[i] - hashB[i]);
    return 1 - diff / (hashA.length * 255);
  }

  async function groupSimilarImages(threshold = 0.92) {
    const hashes = await Promise.all(images.map(img => getImageHash(img.src, img.isRaw)));
    const groups = [];
    const assigned = new Array(images.length).fill(false);
    for (let i = 0; i < images.length; i++) {
      if (assigned[i]) continue;
      const group = [i];
      assigned[i] = true;
      for (let j = i + 1; j < images.length; j++) {
        if (!assigned[j] && similarity(hashes[i], hashes[j]) >= threshold) {
          group.push(j);
          assigned[j] = true;
        }
      }
      groups.push(group);
    }
    return groups;
  }

  // ── Analysis ──
  async function startAnalysis() {
    const n = parseInt(document.getElementById('n-input').value);
    const total = images.length;
    const nInput = document.getElementById('n-input');
    const apiError = document.getElementById('api-error');
    apiError.style.display = 'none';

    if (isNaN(n) || n < 1 || n >= total) {
      nInput.classList.add('error');
      setTimeout(() => nInput.classList.remove('error'), 1500);
      return;
    }

    const btn = document.getElementById('analyze-btn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> 분석 중...`;

    const progressArea = document.getElementById('progress-area');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const progressPct = document.getElementById('progress-pct');
    progressArea.style.display = 'block';

    document.getElementById('results-section').style.display = 'none';
    document.getElementById('results-list').innerHTML = '';

    try {
      // Step 1: use pre-computed dedup groups or individual
      let groups, dupCount;
      if (dedupActive && dedupGroups) {
        groups = dedupGroups;
        dupCount = images.length - groups.length;
        progressFill.style.width = '5%';
      } else {
        progressLabel.textContent = '사진 준비 중...';
        progressFill.style.width = '5%';
        groups = images.map((_, i) => [i]);
        dupCount = 0;
      }

      // Step 2: analyze one representative per group
      const scores = [];
      for (let g = 0; g < groups.length; g++) {
        const pct = Math.round(5 + (g / groups.length) * 93);
        progressLabel.textContent = `그룹 ${g + 1}/${groups.length} 분석 중...`;
        progressPct.textContent = pct + '%';
        progressFill.style.width = pct + '%';

        const repIdx = groups[g][0];
        const base64 = images[repIdx].src.split(',')[1];
        const mediaType = images[repIdx].type;

        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64: base64, mediaType, filename: images[repIdx].name })
        });

        if (res.status === 401) throw new Error('API_KEY');
        if (!res.ok) throw new Error('API_ERROR');

        const data = await res.json();
        const text = data.text || '';
        let parsed;
        try {
          parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
        } catch {
          parsed = { score: 50, summary: '분석 결과 없음', strengths: [], weaknesses: [] };
        }
        scores.push({ ...parsed, index: repIdx, group: groups[g] });
      }

      progressLabel.textContent = '분석 완료';
      progressPct.textContent = '100%';
      progressFill.style.width = '100%';

      renderResults(scores, n, dupCount);

    } catch (err) {
      progressArea.style.display = 'none';
      if (err.message === 'API_KEY') {
        apiError.textContent = '⚠ API 키가 유효하지 않습니다. 환경변수를 확인하세요.';
      } else {
        apiError.textContent = '⚠ 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
      }
      apiError.style.display = 'block';
    }

    btn.disabled = false;
    btn.innerHTML = `AI 분석 시작 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
  }

  // ── Edit state per card ──
  const editState = {};

  function renderResults(scores, n, dupCount) {
    const sorted = [...scores].sort((a, b) => b.score - a.score);
    const topN = sorted.slice(0, n);

    let heading = `${images.length}장 중 상위 ${n}장`;
    if (dupCount > 0) heading += ` · 유사 사진 ${dupCount}장 자동 제외`;
    document.getElementById('results-heading').textContent = heading;

    const list = document.getElementById('results-list');
    list.innerHTML = '';

    topN.forEach((item, rank) => {
      const img = images[item.index];
      const cardId = `card-${rank}`;
      editState[cardId] = {
        brightness: 0, contrast: 0, saturation: 0,
        warmth: 0, sharpness: 0,
        src: img.src, weaknesses: item.weaknesses || [], strengths: item.strengths || [],
        editedSrc: null,
      };

      const card = document.createElement('div');
      card.className = 'result-card' + (rank === 0 ? ' top1' : '');
      const badgeClass = ['rank-1','rank-2','rank-3'][rank] || 'rank-other';
      const strengths = (item.strengths || []).map(s => `<span class="tag">${s}</span>`).join('');
      const weaknesses = (item.weaknesses || []).map(w => `<span class="tag weak">${w}</span>`).join('');
      const dupBadge = item.group.length > 1
        ? `<span class="tag" style="background:rgba(176,184,200,0.12);color:var(--silver);">유사 ${item.group.length}장 중 최고</span>`
        : '';

      card.innerHTML = `
        <div class="rank-col">
          <div class="rank-badge ${badgeClass}">${rank + 1}</div>
          <div class="score-num">${item.score}</div>
        </div>
        <img class="result-thumb" src="${img.src}" alt="${img.name}" id="thumb-${cardId}">
        <div class="result-body">
          <div class="result-summary">${item.summary || ''}</div>
          <div class="strength-tags">${dupBadge}${strengths}${weaknesses}</div>
          <div class="result-file">${img.name}</div>
          <button class="edit-btn" onclick="toggleEditPanel('${cardId}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            후보정
          </button>

          <div class="edit-panel" id="panel-${cardId}">

            <!-- Step 1 -->
            <div class="edit-step">
              <div class="edit-step-label">
                <span class="step-num">1</span>보정값 설정
                <span class="step-hint">키워드를 선택하거나 직접 입력하세요</span>
              </div>

              <div class="suggest-chips" id="chips-${cardId}">
                <div class="chips-loading">
                  <span class="edit-spinner"></span> AI가 키워드를 분석 중...
                </div>
              </div>

              <div class="edit-sliders">
                <div class="slider-row">
                  <div class="slider-label">밝기 <span id="lbl-brightness-${cardId}">0</span></div>
                  <input type="range" class="edit-range" min="-100" max="100" value="0" id="sl-brightness-${cardId}" oninput="onSlider('${cardId}','brightness',this.value)">
                </div>
                <div class="slider-row">
                  <div class="slider-label">대비 <span id="lbl-contrast-${cardId}">0</span></div>
                  <input type="range" class="edit-range" min="-100" max="100" value="0" id="sl-contrast-${cardId}" oninput="onSlider('${cardId}','contrast',this.value)">
                </div>
                <div class="slider-row">
                  <div class="slider-label">채도 <span id="lbl-saturation-${cardId}">0</span></div>
                  <input type="range" class="edit-range" min="-100" max="100" value="0" id="sl-saturation-${cardId}" oninput="onSlider('${cardId}','saturation',this.value)">
                </div>
                <div class="slider-row">
                  <div class="slider-label">색온도 <span id="lbl-warmth-${cardId}">0</span></div>
                  <input type="range" class="edit-range" min="-100" max="100" value="0" id="sl-warmth-${cardId}" oninput="onSlider('${cardId}','warmth',this.value)">
                </div>
                <div class="slider-row">
                  <div class="slider-label">선명도 <span id="lbl-sharpness-${cardId}">0</span></div>
                  <input type="range" class="edit-range" min="0" max="100" value="0" id="sl-sharpness-${cardId}" oninput="onSlider('${cardId}','sharpness',this.value)">
                </div>
              </div>
            </div>

            <!-- Step 2 -->
            <div class="edit-step">
              <div class="edit-step-label">
                <span class="step-num">2</span>보정 적용 및 비교
                <span class="step-hint">적용 후 핸들을 좌우로 드래그해 원본과 비교</span>
              </div>

              <div class="edit-actions">
                <button class="apply-btn" onclick="applyEdit('${cardId}')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  보정 적용
                </button>
                <button class="reset-btn" onclick="resetEdit('${cardId}')">초기화</button>
                <button class="download-btn" id="dl-btn-${cardId}" onclick="downloadEdit('${cardId}')">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  저장
                </button>
              </div>

              <div class="compare-wrap" id="preview-${cardId}">
                <img id="preview-after-${cardId}" src="" alt="보정 후">
                <div class="compare-after" id="compare-after-${cardId}" style="clip-path: inset(0 0 0 50%);">
                  <img id="preview-before-${cardId}" src="" alt="원본">
                </div>
                <div class="compare-divider" id="compare-div-${cardId}" style="left:50%;">
                  <div class="compare-handle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                      <polyline points="15 18 9 12 15 6"/>
                      <polyline points="9 18 3 12 9 6" transform="translate(6,0)"/>
                    </svg>
                  </div>
                </div>
                <span class="compare-label-before">보정 후</span>
                <span class="compare-label-after">원본</span>
                <div class="compare-hint-overlay" id="compare-hint-${cardId}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M19 9l3 3-3 3M3 12h18"/></svg>
                  드래그해서 비교
                </div>
              </div>
            </div>

          </div>
        </div>`;
      list.appendChild(card);
    });

    const section = document.getElementById('results-section');
    section.style.display = 'block';
    setTimeout(() => section.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }

  // ── Edit Panel Logic ──
  function toggleEditPanel(cardId) {
    const panel = document.getElementById(`panel-${cardId}`);
    const isOpening = !panel.classList.contains('open');
    panel.classList.toggle('open');
    // Auto-run AI keyword suggestion when first opened
    if (isOpening && !editState[cardId].keywordsLoaded) {
      editState[cardId].keywordsLoaded = true;
      aiSuggest(cardId);
    }
  }

  function onSlider(cardId, param, val) {
    editState[cardId][param] = parseInt(val);
    document.getElementById(`lbl-${param}-${cardId}`).textContent = val;
  }

  function resetEdit(cardId) {
    const s = editState[cardId];
    s.brightness = s.contrast = s.saturation = s.warmth = s.sharpness = 0;
    ['brightness','contrast','saturation','warmth','sharpness'].forEach(p => {
      const sl = document.getElementById(`sl-${p}-${cardId}`);
      if (sl) { sl.value = 0; document.getElementById(`lbl-${p}-${cardId}`).textContent = '0'; }
    });
    const preview = document.getElementById(`preview-${cardId}`);
    preview.classList.remove('visible');
    document.getElementById(`dl-btn-${cardId}`).classList.remove('visible');
    document.getElementById(`thumb-${cardId}`).src = editState[cardId].src;
    editState[cardId].editedSrc = null;
    editState[cardId].sliderDragging = false;
  }

  async function aiSuggest(cardId) {
    const chips = document.getElementById(`chips-${cardId}`);
    chips.innerHTML = '<div class="chips-loading"><span class="edit-spinner"></span> AI가 키워드를 분석 중...</div>';

    const s = editState[cardId];
    const weaknesses = s.weaknesses.join(', ') || '없음';
    const strengths = s.strengths.join(', ') || '없음';

    try {
      const res = await fetch('/api/suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weaknesses, strengths })
      });
      const data = await res.json();

      editState[cardId].selectedKeywords = new Set();
      chips.innerHTML = '';

      const allKeywords = data.keywords || data.suggestions || [];
      if (allKeywords.length) {
        // Section label
        const lbl = document.createElement('div');
        lbl.className = 'chips-section-label';
        lbl.textContent = '키워드 선택 (복수 가능)';
        chips.appendChild(lbl);

        allKeywords.forEach(kw => {
          const chip = document.createElement('span');
          chip.className = 'suggest-chip';
          chip.textContent = kw;
          chip.onclick = () => toggleKeyword(cardId, kw, chip);
          chips.appendChild(chip);
        });
      }

      // Unified input — at the bottom of chips area
      const inputRow = document.createElement('div');
      inputRow.className = 'chips-input-row';
      inputRow.innerHTML = `<input type="text" class="edit-prompt-input" id="custom-kw-${cardId}" placeholder="직접 입력 후 Enter로 추가">`;
      const customInput = inputRow.querySelector('input');
      customInput.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const val = customInput.value.trim();
        if (!val) return;
        const chip = document.createElement('span');
        chip.className = 'suggest-chip selected';
        chip.textContent = val;
        chip.onclick = () => toggleKeyword(cardId, val, chip);
        chips.insertBefore(chip, inputRow);
        editState[cardId].selectedKeywords.add(val);
        applyKeywordsToSliders(cardId);
        customInput.value = '';
        customInput.focus();
      });
      chips.appendChild(inputRow);

    } catch(e) {
      chips.innerHTML = '<div class="chips-loading" style="color:var(--danger)">키워드 로딩 실패 — 잠시 후 다시 시도해주세요</div>';
    }
  }

  function toggleKeyword(cardId, kw, chip) {
    const sel = editState[cardId].selectedKeywords;
    if (sel.has(kw)) { sel.delete(kw); chip.classList.remove('selected'); }
    else             { sel.add(kw);    chip.classList.add('selected'); }
    applyKeywordsToSliders(cardId);
  }

  async function applyKeywordsToSliders(cardId) {
    const selected = [...(editState[cardId].selectedKeywords || [])];
    if (!selected.length) {
      // Reset sliders to 0
      ['brightness','contrast','saturation','warmth','sharpness'].forEach(p => {
        editState[cardId][p] = 0;
        const sl = document.getElementById(`sl-${p}-${cardId}`);
        if (sl) { sl.value = 0; document.getElementById(`lbl-${p}-${cardId}`).textContent = '0'; }
      });
      return;
    }

    // Ask AI to compute combined adjustments for selected keywords
    const s = editState[cardId];
    try {
      const res = await fetch('/api/suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          weaknesses: s.weaknesses.join(', ') || '없음',
          strengths: s.strengths.join(', ') || '없음',
          keywords: selected,
        })
      });
      const data = await res.json();
      const sugg = data.adjustments || {};
      ['brightness','contrast','saturation','warmth','sharpness'].forEach(p => {
        if (sugg[p] !== undefined) {
          editState[cardId][p] = sugg[p];
          const sl = document.getElementById(`sl-${p}-${cardId}`);
          if (sl) { sl.value = sugg[p]; document.getElementById(`lbl-${p}-${cardId}`).textContent = sugg[p]; }
        }
      });
    } catch(e) { console.error(e); }
  }

  function applyEdit(cardId) {
    const s = editState[cardId];

    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imageData.data;

      let { brightness, contrast, saturation, warmth, sharpness } = s;

      const br = brightness / 100 * 80;   // -80 ~ +80
      const ct = contrast / 100;           // -1 ~ +1
      const st = saturation / 100;         // -1 ~ +1
      const wm = warmth / 100 * 40;        // -40 ~ +40 (RGB offset)

      for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2];

        // Brightness
        r += br; g += br; b += br;

        // Contrast
        r = (r - 128) * (1 + ct) + 128;
        g = (g - 128) * (1 + ct) + 128;
        b = (b - 128) * (1 + ct) + 128;

        // Warmth (shift red/blue)
        r += wm; b -= wm;

        // Saturation (via luminance)
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        r = lum + (r - lum) * (1 + st);
        g = lum + (g - lum) * (1 + st);
        b = lum + (b - lum) * (1 + st);

        d[i]   = Math.max(0, Math.min(255, r));
        d[i+1] = Math.max(0, Math.min(255, g));
        d[i+2] = Math.max(0, Math.min(255, b));
      }

      ctx.putImageData(imageData, 0, 0);

      // Sharpness via CSS filter fallback (simple)
      const sharpenPx = sharpness > 0 ? (sharpness / 100 * 1.5).toFixed(2) : 0;

      const editedSrc = canvas.toDataURL('image/jpeg', 0.92);
      editState[cardId].editedSrc = editedSrc;

      // Show compare slider
      const sharpenFilter = sharpenPx > 0 ? `contrast(${1 + parseFloat(sharpenPx) * 0.2}) saturate(${1 + parseFloat(sharpenPx) * 0.1})` : '';
      const afterImg  = document.getElementById(`preview-after-${cardId}`);   // base = 보정 후
      const beforeImg = document.getElementById(`preview-before-${cardId}`); // overlay = 원본
      afterImg.src    = editedSrc;   // base layer: 보정 후 (left side)
      afterImg.style.filter = sharpenFilter;
      beforeImg.src   = s.src;       // overlay layer: 원본 (right side, clipped left)

      const wrap = document.getElementById(`preview-${cardId}`);
      wrap.classList.add('visible');
      document.getElementById(`dl-btn-${cardId}`).classList.add('visible');

      // Init compare slider interaction
      initCompareSlider(cardId);

      // Update thumb
      document.getElementById(`thumb-${cardId}`).src = editedSrc;
    };
    img.src = s.src;
  }

  function initCompareSlider(cardId) {
    const wrap = document.getElementById(`preview-${cardId}`);
    const divider = document.getElementById(`compare-div-${cardId}`);
    const afterClip = document.getElementById(`compare-after-${cardId}`);
    if (!wrap || !divider || !afterClip) return;

    // Avoid binding twice
    if (wrap._sliderBound) return;
    wrap._sliderBound = true;

    const hintEl = document.getElementById(`compare-hint-${cardId}`);
    function setPosition(clientX) {
      const rect = wrap.getBoundingClientRect();
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.max(0.02, Math.min(0.98, pct));
      const pctPx = (pct * 100).toFixed(2) + '%';
      divider.style.left = pctPx;
      afterClip.style.clipPath = `inset(0 0 0 ${(pct * 100).toFixed(2)}%)`;
      if (hintEl) hintEl.classList.add('hidden');
    }

    // Set initial 50%
    setPosition(wrap.getBoundingClientRect().left + wrap.getBoundingClientRect().width * 0.5);

    let dragging = false;
    wrap.addEventListener('mousedown', e => { dragging = true; setPosition(e.clientX); });
    window.addEventListener('mousemove', e => { if (dragging) setPosition(e.clientX); });
    window.addEventListener('mouseup', () => { dragging = false; });

    // Touch
    wrap.addEventListener('touchstart', e => { dragging = true; setPosition(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('touchmove', e => { if (dragging) setPosition(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('touchend', () => { dragging = false; });
  }

  function downloadEdit(cardId) {
    const src = editState[cardId].editedSrc;
    if (!src) return;
    const a = document.createElement('a');
    a.href = src;
    a.download = `edited_${cardId}.jpg`;
    a.click();
  }
</script>
